[package]
name = "distrovmm"
version = "0.1.0"
edition = "2021"
authors = ["distrovmm contributors"]
license = "Apache-2.0"
description = "Run full-system Linux virtual machines as easily as containers"
repository = "https://github.com/ericcurtin/distrovmm"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
tempfile = "3.14"
dirs = "5.0"
